[purescript]
format = 'via [$symbol]($style)'

[python]
format = 'via [$symbol]($style)'
symbol = " "

[quarto]
format = 'via [$symbol]($style)'

[raku]
format = 'via [$symbol]($style)'

[red]
format = 'via [$symbol]($style)'

[rlang]
format = 'via [$symbol]($style)'
symbol = "󰟔 "

[ruby]
format = 'via [$symbol]($style)'
symbol = " "

[rust]
format = 'via [$symbol]($style)'
symbol = "󱘗 "

[solidity]
format = 'via [$symbol]($style)'

[typst]
format = 'via [$symbol]($style)'

[swift]
format = 'via [$symbol]($style)'
symbol = " "

[vagrant]
format = 'via [$symbol]($style)'

[vlang]
format = 'via [$symbol]($style)'

[zig]
format = 'via [$symbol]($style)'
symbol = " "

[aws]
symbol = "  "
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[c]
symbol = " "

[conda]
symbol = " "

[docker_context]
symbol = " "
style = 'fg:#74c7ec'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

